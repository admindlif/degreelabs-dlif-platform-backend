name: Safely Reprocess R2 Recording Audio

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "Session UUID whose canonical recording should be inspected"
        required: true
        type: string
      mode:
        description: "Dry run only reads metadata; execute writes backup/staging/canonical objects"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - execute
      confirmation:
        description: "For execute mode, repeat the exact session UUID"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: r2-recording-maintenance
  cancel-in-progress: false

jobs:
  reprocess:
    name: Backup and Reprocess One Recording
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      SESSION_ID_INPUT: ${{ inputs.session_id }}
      MODE_INPUT: ${{ inputs.mode }}
      CONFIRMATION_INPUT: ${{ inputs.confirmation }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install R2 client dependency
        run: pip install boto3==1.43.112

      - name: Validate required secrets without printing values
        shell: bash
        run: |
          missing=0
          for name in R2_ENDPOINT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Dry-run inspection
        if: ${{ inputs.mode == 'dry-run' }}
        run: python scripts/reprocess_r2_recording_audio.py --session-id "$SESSION_ID_INPUT"

      - name: Backup and reprocess recording
        if: ${{ inputs.mode == 'execute' }}
        run: |
          python scripts/reprocess_r2_recording_audio.py \
            --session-id "$SESSION_ID_INPUT" \
            --execute \
            --confirmation "$CONFIRMATION_INPUT"
